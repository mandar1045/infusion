openapi: 3.1.0
info:
  title: Petstore
  version: "1.0"
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          description: OK
components:
  schemas:
    Pet:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        tag: {type: [string, "null"], default: null}
        born: {type: string, example: 2024-01-15}
        flag: {type: string, example: "true"}
